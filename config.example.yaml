# 服务绑定的主机/网卡地址。默认留空（""）表示绑定所有接口（IPv4 + IPv6）。
# 如需仅允许本机访问，可使用 "127.0.0.1" 或 "localhost"。
host: ""

# 服务端口
port: 8317

# HTTPS 的 TLS 配置。启用后，服务会使用提供的证书和私钥监听。
tls:
  enable: false
  cert: ""
  key: ""

# 管理 API 配置
remote-management:
  # 是否允许远程（非 localhost）访问管理接口。
  # 为 false 时，仅 localhost 可以访问管理端点（仍然需要提供密钥）。
  allow-remote: false

  # 管理密钥。如果这里填写明文，启动时会自动转成哈希。
  # 所有管理请求（包括来自 localhost 的请求）都需要携带该密钥。
  # 留空将完全禁用管理 API（所有 /v0/management 路由都会返回 404）。
  secret-key: ""

  # 为 true 时，禁用内置管理控制面板资源下载和对应 HTTP 路由。
  disable-control-panel: false

  # 禁用从 GitHub 后台定时自动更新管理面板（默认 false）。
  # 启用后，仅在首次访问且本地缺失时下载，后续不再自动更新。
  # disable-auto-update-panel: false

  # 管理控制面板的 GitHub 仓库地址。支持填写仓库 URL 或 releases API URL。
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# 认证目录（支持使用 ~ 表示用户主目录）
auth-dir: "~/.cli-proxy-api"

# 用于鉴权的 API key
api-keys:
  - "your-api-key-1"
  - "your-api-key-2"
  - "your-api-key-3"

# 是否启用调试日志
debug: false

# 是否启用 pprof HTTP 调试服务（host:port）。出于安全考虑建议仅绑定 localhost。
pprof:
  enable: false
  addr: "127.0.0.1:8316"

# 标准动态库插件属于进程内可信代码，默认关闭。
# Go 示例请针对目标 GOOS/GOARCH 使用 go build -buildmode=c-shared 构建。
# 其他语言也可以实现相同的 C ABI 和 JSON 方法协议。
# 插件执行器需要存在 provider key 相同的对应 auth 记录。
# 如果同一个 provider 同时配置为 OpenAI 兼容模式（OpenAI-compatible），则优先使用原生执行器。
# 插件命令行参数和 Management API 路由属于可选能力。
# 已存在的原生命令行参数/路由，以及更高优先级插件的参数/路由，不能被替换。
# 插件列表 Management API 会从插件元数据中读取 Logo 和 ConfigFields，用于管理界面展示。
# 单个插件的 enabled 只控制 plugins.configs.<pluginID>.enabled，不会隐式修改全局 plugins.enabled。
plugins:
  enabled: false
  dir: "plugins"
  # 额外的插件商店注册表地址。内置官方注册表始终会被包含。
  # store-sources:
  #   - "https://example.com/cliproxy-plugins/registry.json"
  # 可选的插件商店鉴权规则。值会从环境变量读取；
  # token 不会写入插件清单或节点状态。
  # store-auth:
  #   - match: "https://example.com/cliproxy-plugins/"
  #     apply-to: ["registry", "artifact"]
  #     type: bearer
  #     token-env: "CLIPROXY_PLUGIN_STORE_TOKEN"
  configs:
    usage-dashboard-zduu:
      # CPA 插件宿主通用字段：是否启用当前插件
      enabled: true
      # CPA 插件宿主通用字段：插件优先级。仅在多个插件能力冲突时需要。
      # priority: 1
      # CPA 插件宿主通用字段：插件商店安装元数据。手动放置插件文件时可省略。
      # store:
      #   version: "2.4.7"
      #   release-tag: "v2.4.7"
      #   repository: "https://github.com/zduu/cpa-usage-plugin"

      # 以下为用量统计插件自己的配置字段
      max_details_per_model: 5000
      retention_days: 30
      dedup_window_minutes: 1440
      log_response_headers: ""
      api_key_hash_salt: ""
      storage_enabled: true
      storage_path: "data/usage-statistics.jsonl"
      storage_flush_interval_seconds: 5
      storage_snapshot_interval_seconds: 300
      storage_snapshot_record_interval: 1000
      storage_sync_interval_seconds: 0
      storage_sync_record_interval: 0
      export_max_records: 100000
      price_storage_path: "usage-statistics-prices.json"
      models_dev_prices_enabled: false
      models_dev_prices_url: "https://models.dev/api.json"
      models_dev_prices_refresh_interval_seconds: 43200
      update_enabled: false
      update_version: "latest"

# 为 true 时，关闭高开销请求日志和部分 HTTP 中间件能力，以降低高并发下的单请求内存占用。
commercial-mode: false

# 为 true 时，将应用日志写入轮转文件，而不是输出到 stdout
logging-to-file: false

# logs 目录下日志文件允许占用的最大总大小（MB）。超出后会删除最旧的日志文件，
# 直到回到限制范围内。设为 0 表示禁用该限制。
logs-max-total-size-mb: 0

# 关闭请求日志时保留的错误日志文件最大数量。
# 超出后会删除最旧的错误日志文件。默认 10，设为 0 表示禁用清理。
error-logs-max-files: 10

# 为 false 时，禁用内存中的用量统计聚合
usage-statistics-enabled: false

# Management API 中的用量队列项在内存中的保留时长（秒）。
# 本地 Redis RESP 用量输出已禁用。
# 默认值：60，最大值：3600。
redis-usage-queue-retention-seconds: 60

# 代理 URL。支持 socks5/http/https 协议，例如：socks5://user:pass@192.168.1.1:1080/
# 每个条目的 proxy-url 也支持填写 "direct" 或 "none"，以显式绕过全局 proxy-url 和环境代理。
proxy-url: ""

# 为 true 时，不带前缀的模型请求只会使用无前缀的凭证（prefix 与模型名相同的情况除外）。
force-model-prefix: false

# 为 true 时，将经过过滤的上游响应头透传给下游客户端。
# 默认 false（关闭）。
passthrough-headers: false

# 请求失败后的重试次数。当 HTTP 响应码为 403、408、500、502、503 或 504 时会触发重试。
request-retry: 3

# 单次失败请求最多尝试的不同凭证数量。
# 设为 0 表示保持旧行为（尝试所有可用凭证）。
max-retry-credentials: 0

# 触发重试前，等待某个冷却中凭证恢复可用的最长时间（秒）。
max-retry-interval: 30

# 为 true 时，全局禁用 auth/model 冷却调度（避免失败状态后的黑窗期）。
disable-cooling: false

# 为 true 时，将每个 auth 的冷却状态以 .cds 文件形式持久化到 auth 文件旁边。
# 默认 false；为 false 时，冷却状态仅保存在内存中。
save-cooldown-status: false

# 上游瞬时错误（408/500/502/503/504）的冷却时长，单位秒。
# 设为 0 表示沿用旧版 60 秒冷却；设为 -1 表示禁用这类瞬时错误冷却。
transient-error-cooldown-seconds: 0

# 为 true 时，全局禁用 Claude 请求伪装（Claude Code CLI 伪装和
# 系统提示词（system prompt）替换），这样原始 system prompt 会原样传给 Claude。
# 单个凭证仍可覆盖此设置：claude-api-key 条目可通过 "cloak.mode"，
# Claude OAuth/token 文件可通过 "cloak_mode" 配置。默认 false 会保留按客户端判断的
# "auto" 行为（仅对非 Claude Code 客户端启用伪装）。
disable-claude-cloak-mode: false

# disable-image-generation 支持：false（默认）、true、"chat" 或 "passthrough"。
# - true：在所有位置禁用 image_generation（/v1/images/generations 和 /v1/images/edits 也会返回 404）。
# - "chat"：在非 images 端点上禁用 image_generation 注入，但保留 /v1/images/generations 和 /v1/images/edits。
# - "passthrough"：在非 images 端点上既不注入也不剥离 image_generation（原样转发客户端 payload）；在 /v1/images/* 端点上的行为与 "chat" 相同。
disable-image-generation: false

# 当 Codex 图片请求不是直接通过 Image API 代理时，旧版托管 image_generation 工具链路所使用的基础模型。
# 必须以 "gpt-" 开头（不区分大小写）。未设置或无效时，默认使用 "gpt-5.4-mini"。
# gpt-image-2-base-model: "gpt-5.4-mini"

# /openai/v1/videos 和 xAI 视频创建接口返回的视频 ID 与创建它们的凭证之间的绑定保留时长。
# 默认值：3h。
video-result-auth-cache-ttl: "3h"

# 核心 auth 自动刷新工作池大小（OAuth/文件型 auth token 刷新）。
# 大于 0 时，会覆盖默认 worker 数量（16）。
# auth-auto-refresh-workers: 16

# 配额超限时的行为
quota-exceeded:
  switch-project: true # 配额超限时是否自动切换到其他项目
  switch-preview-model: true # 配额超限时是否自动切换到 preview 模型
  antigravity-credits: true # Claude 模型的所有免费 auth 耗尽后，是否将 credits 作为最后兜底

# 多个凭证同时匹配时的路由策略
routing:
  strategy: "round-robin" # 可选：round-robin（默认）、fill-first
  # 为所有客户端启用通用的会话粘性路由。
  # Session ID 会从以下位置提取：metadata.user_id（Claude Code session 格式）、
  # X-Session-ID、Session_id（Codex）、X-Client-Request-Id（PI）、conversation_id，
  # 或前几条消息的哈希值。
  # 当已绑定的 auth 不可用时，始终会自动故障转移。
  session-affinity: false # 默认：false
  # session 与 auth 绑定关系的保留时长。默认：1h
  session-affinity-ttl: "1h"

# Codex provider 的行为配置
codex:
  # 为 true 时，且 routing.strategy 为 fill-first 或 routing.session-affinity 为 true 时，
  # 会按选中的 auth 重新映射 Codex 的 prompt_cache_key 和 installation identity。
  # 有些用户认为请求跟踪标识可能会被拿来作为 TOS 风控封禁的证据；
  # 这个选项只是为了满足这种顾虑。
  identity-confuse: false

# 为 true 时，为 WebSocket API（/v1/ws）启用鉴权。
ws-auth: true

# 大于 0 时，针对非流式响应每隔 N 秒发送一个空行，以避免空闲超时。
nonstream-keepalive-interval: 0
# 流式响应行为配置（SSE 保活 + 安全的启动重试）。
# streaming:
#   keepalive-seconds: 15   # 默认：0（关闭）。<= 0 表示禁用保活。
#   bootstrap-retries: 1    # 默认：0（关闭）。在首字节发送前允许的重试次数。

# thinking block（Antigravity/Claude）的签名缓存校验。
# 为 true（默认）时，优先使用并校验缓存签名。
# 为 false 时，归一化后直接使用客户端签名（测试用绕过模式）。
# antigravity-signature-cache-enabled: true

# 绕过模式下的签名校验严格度（仅在禁用签名缓存时生效）。
# 为 true 时，校验完整 Claude protobuf 树（Field 2 -> Field 1 结构）。
# 为 false（默认）时，仅检查 R/E 前缀 + base64 + 首字节 0x12。
# antigravity-signature-bypass-strict: false


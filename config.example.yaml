#       # "cloak_strict_mode" / "cloak_sensitive_words" / "cloak_cache_user_id" 设置同类选项。顶层
#       # "disable-claude-cloak-mode: true" 可一次性禁用所有 Claude 凭证的伪装。
#       strict-mode: false           # false（默认）：把 Claude Code prompt 追加到用户 system 消息前

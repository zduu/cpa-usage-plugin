#       cache-user-id: true          # 可选：默认 false；设为 true 时按 API key 复用缓存的 user_id，而不是每次请求随机生成
#     experimental-cch-signing: false # 可选：默认 false；为 true 时，使用当前 Claude Code cch 算法对最终 /v1/messages body 签名
#                                     # 除非你明确需要该行为，否则建议保持关闭，这样上游 seed 变化时会回退到旧版代理行为

# Claude API 请求的默认请求头。Claude Code 发布新版本时请及时更新。
# 在旧兼容模式（legacy）下，当客户端未携带这些值时，user-agent/package-version/runtime-version/timeout
# 会作为兜底值，OS/arch 仍然由运行环境决定。启用
# stabilize-device-profile 后，OS/arch 会固定为下面的基线值，
# 而 user-agent/package-version/runtime-version 会作为软件指纹种子，
# 但仍可升级到更高版本的官方 Claude 客户端。
# claude-header-defaults:
#   user-agent: "claude-cli/2.1.44 (external, sdk-cli)"
#   package-version: "0.74.0"
#   runtime-version: "v24.3.0"
#   os: "MacOS"
#   arch: "arm64"
#   timeout: "600"
#   stabilize-device-profile: false  # 可选，默认 false；设为 true 时按 auth/API key 固定设备指纹

# Codex OAuth 模型请求的默认请求头。
# 仅在文件型/OAuth Codex 请求且客户端未发送对应请求头时生效。
# `user-agent` 同时作用于 HTTP 和 websocket 请求；
# `beta-features` 仅作用于 websocket 请求。它们不适用于 codex-api-key 条目。
# codex-header-defaults:
#   user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
#   beta-features: "multi_agent"

# OpenAI 兼容 provider 配置
# openai-compatibility:
#   - name: "openrouter" # provider 名称；会用于 user agent 等位置。
#     disabled: false # 可选：设为 true 可在不删除配置的情况下禁用该 provider
#     prefix: "test" # 可选：要求使用 "test/kimi-k2" 这类调用方式来命中该 provider 的凭证
#     base-url: "https://openrouter.ai/api/v1" # provider 的基础地址。
#     disable-cooling: false # 可选：按 provider 覆盖 auth/model 冷却调度
#     headers:
#       X-Custom-Header: "custom-value"
#     api-key-entries:
#       - api-key: "sk-or-v1-...b780"
#         proxy-url: "socks5://proxy.example.com:1080" # 可选：按 key 覆盖代理
#         # proxy-url: "direct" # 可选：显式指定该凭证直连
#       - api-key: "sk-or-v1-...b781" # 未配置 proxy-url
#     models: # 该 provider 支持的模型列表。
#       - name: "moonshotai/kimi-k2:free" # 实际上游模型名。
#         alias: "kimi-k2"               # API 对外使用的别名。
#         image: false                   # 可选：设为 true 后允许该模型用于 /v1/images/generations 和 /v1/images/edits（不包含 chat/responses 的图片输入）
#         input-modalities: [text, image] # 可选：为 Codex 客户端声明 /v1/chat/completions 和 /v1/responses 的多模态输入能力
#         output-modalities: [text]       # 可选：已知时声明输出模态
#         thinking:                      # 可选：省略时默认使用 ["low","medium","high"]
#           levels: ["low", "medium", "high"]
#       # 可以重复使用同一个 alias，以构建内部模型池。
#       # 客户端在模型列表中仍然只会看到这一个 alias。
#       # 发往该 alias 的请求会在下面这些上游模型之间轮询，
#       # 如果选中的上游在产出响应前失败，请求会继续切到同一 alias 池中的下一个上游模型。
#       - name: "deepseek-v3.1"
#         alias: "claude-opus-4.66"
#       - name: "glm-5"
#         alias: "claude-opus-4.66"
#       - name: "kimi-k2.5"
#         alias: "claude-opus-4.66"

# Vertex API key 配置（兼容 Vertex 的端点，base-url 可选）
# vertex-api-key:
#   - api-key: "vk-123..."                        # 对应 x-goog-api-key 请求头
#     prefix: "test"                              # 可选：要求使用 "test/vertex-pro" 这类调用方式来命中该凭证
#     base-url: "https://example.com/api"         # 可选，例如 https://zenmux.ai/api；留空时回退到 Google Vertex
#     proxy-url: "socks5://proxy.example.com:1080" # 可选：按 key 覆盖代理
#     # proxy-url: "direct" # 可选：显式指定该凭证直连
#     headers:
#       X-Custom-Header: "custom-value"
#     models:                                     # 可选：将别名映射到上游模型名
#       - name: "gemini-2.5-flash"                # 上游模型名
#         alias: "vertex-flash"                   # 面向客户端显示的别名
#       - name: "gemini-2.5-pro"
#         alias: "vertex-pro"
#     excluded-models:                            # 可选：从模型列表中排除的模型
#       - "imagen-3.0-generate-002"
#       - "imagen-*"

# 全局 OAuth 模型别名（按 channel 配置）
# 这些别名同时影响模型列表展示和请求路由时使用的模型 ID。
# 支持的 channel：vertex、aistudio、antigravity、claude、codex、kimi、xai。
# 注意：这些别名不适用于 gemini-api-key、interactions-api-key、codex-api-key、claude-api-key、openai-compatibility 或 vertex-api-key。
# 注意：由于别名会影响合并后的 /v1 模型列表和合并后的请求路由，不同 provider 之间如果暴露了重名的
# 客户端模型名，就可能产生歧义。若需严格绑定后端，请使用唯一别名/前缀，或避免重名。
# 你可以为同一个 name 配置多个 alias，以暴露多个客户端可见模型名。
# 每个条目可选标记：
#   fork: true          # 保留上游模型，同时把 alias 额外暴露为一个独立的客户端可见模型
#   force-mapping: true # 可选：将上游响应中的模型字段重写回客户端可见别名（下面示例仅对 antigravity 演示）
# 按 auth 的 OAuth 别名也可以存放在 OAuth auth JSON 文件中的 "model-aliases" 字段里。
# 它们只对当前选中的 auth 生效，并且在同一客户端可见别名上优先级高于全局别名。
# auth JSON 示例：
# {
#   "type": "codex",
#   "email": "user@example.com",
#   "model-aliases": [
#     {"name": "gpt-5.3-codex-spark", "alias": "gpt-5.5"},
#     {"name": "gpt-5.3-codex-spark", "alias": "gpt-5.4"}
#   ]
# }
# oauth-model-alias:
#   vertex:
#     - name: "gemini-2.5-pro"
#       alias: "g2.5p"
#   aistudio:
#     - name: "gemini-2.5-pro"
#       alias: "g2.5p"
#   antigravity:
#     - name: "gemini-pro-agent"          # Antigravity 上游模型 ID
#       alias: "gemini-3.1-pro-preview"   # 客户端可见 ID（Gemini 3.1 Pro Preview）
#       fork: true
#       force-mapping: true
#   claude:
#     - name: "claude-sonnet-4-5-20250929"
#       alias: "cs4.5"
#   codex:
#     - name: "gpt-5"
#       alias: "g5"
#   kimi:
#     - name: "kimi-k2.5"
#       alias: "k2.5"
#   xai:
#     - name: "grok-4.3"
#       alias: "grok-latest"
#   sample-provider:                  # OAuth 插件同样支持插件 provider key
#     - name: "sample-model-latest"
#       alias: "sample-latest"

